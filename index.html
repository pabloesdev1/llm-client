<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gemma 4 Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f9f9f9; }
        .control-panel { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-status { background: #607d8b; color: white; }
        .btn-load { background: #4caf50; color: white; }
        .btn-unload { background: #f44336; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.8; }

        #status-indicator { font-size: 0.9em; font-weight: bold; }
        .status-ready { color: #4caf50; }
        .status-off { color: #f44336; }

        /* Loader Style */
        .loader {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 5px;
            vertical-align: middle;
            display: none; /* Oculto por defecto */
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #output { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; min-height: 100px; white-space: pre-wrap; }
        .chat-box { margin-top: 20px; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Gestión de Modelo Gemma 4</h2>
	
<div class="config-panel" style="margin-bottom: 20px; padding: 10px; background: #eee; border-radius: 8px;">
    <label for="baseUrl"><strong>API URL:</strong></label>
    <input id="baseUrl" type="text" value="http://127.0.0.1:8400" style="width: 300px;" />
    <button onclick="saveUrl()" style="background: #607d8b; color: white;">Guardar URL</button>
</div>

    <!-- Panel de Control -->
    <div class="control-panel">
        <button class="btn-status" onclick="checkStatus()">Verificar Status</button>
        <button class="btn-load" id="loadBtn" onclick="manageModel('preload')">Cargar en RAM</button>
        <button class="btn-unload" id="unloadBtn" onclick="manageModel('unload')">Quitar de RAM</button>
        
        <span id="status-indicator">Estado: <span class="status-off">Desconocido</span></span>
        <div id="action-loader" class="loader"></div>
    </div>

    <hr>

    <div class="chat-box">
        <input id="input" placeholder="Escribe tu mensaje aquí..." />
        <button class="btn-load" onclick="sendChat()" style="background: #2196f3;">Enviar</button>
    </div>

    <pre id="output">Los mensajes aparecerán aquí...</pre>

    <script>
        const output = document.getElementById("output");
        const statusSpan = document.getElementById("status-indicator");
        const loader = document.getElementById("action-loader");

        // URL base de tu backend (puedes cambiarla a localhost si no usas ngrok para pruebas)
        let BASE_URL = localStorage.getItem("api_url") || "http://127.0.0.1:8400";
    document.getElementById("baseUrl").value = BASE_URL;

    function saveUrl() {
        const newUrl = document.getElementById("baseUrl").value.replace(/\/$/, ""); // Quita la barra final si existe
        BASE_URL = newUrl;
        localStorage.setItem("api_url", newUrl);
        alert("URL actualizada a: " + newUrl);
        checkStatus(); // Verificamos el estado con la nueva URL
    }

        function showLoader(show) {
            loader.style.display = show ? "inline-block" : "none";
        }

        // Función para verificar si el modelo está en RAM
        async function checkStatus() {
            showLoader(true);
            try {
                const res = await fetch(`${BASE_URL}/check-model`, { headers: { "ngrok-skip-browser-warning": "true" } });
                const data = await res.json();
                
                if (data.status === "ready") {
                    statusSpan.innerHTML = 'Estado: <span class="status-ready">En Memoria (Listo)</span>';
                } else {
                    statusSpan.innerHTML = 'Estado: <span class="status-off">Descargado</span>';
                }
            } catch (e) {
                statusSpan.innerHTML = 'Estado: <span class="status-off">Error de conexión</span>';
            }
            showLoader(false);
        }

        // Función para Preload o Unload
        async function manageModel(endpoint) {
            showLoader(true);
            output.textContent = `Ejecutando ${endpoint}... Por favor espera.\n`;
            
            try {
                const res = await fetch(`${BASE_URL}/${endpoint}`, { headers: { "ngrok-skip-browser-warning": "true" } });
                const data = await res.json();
                
                output.textContent += `Servidor dice: ${data.status || data.message || "OK"}\n`;
                
                // Pequeño delay para dejar que Ollama refresque su estado interno
                setTimeout(checkStatus, 1000);
            } catch (e) {
                output.textContent += "Error al procesar la solicitud.";
            }
            showLoader(false);
        }

        // Función de Chat (Streaming)
        async function sendChat() {
    const input = document.getElementById("input");
    const btn = document.querySelector(".chat-box button");
    const prompt = input.value;
    
    if (!prompt) return;

    // 1. Iniciar estado de "Procesando"
    showLoader(true);
    btn.disabled = true;
    const originalBtnText = btn.textContent;
    btn.textContent = "Procesando...";
    output.textContent = "Escribiendo...\n";

    try {
        // 2. Llamada al bridge de Electron (preload.js)
        await window.api.sendMessage(prompt, BASE_URL, (chunk) => {
            // Si es el primer pedazo de texto, limpiamos el "Escribiendo..."
            if (output.textContent === "Escribiendo...\n") {
                output.textContent = "";
            }
            output.textContent += chunk;
        });
    } catch (e) {
        output.textContent += "\n[Error al procesar la respuesta]";
        console.error(e);
    } finally {
        // 3. Restaurar estado original
        showLoader(false);
        btn.disabled = false;
        btn.textContent = originalBtnText;
        input.value = ""; // Limpiar input tras enviar
    }
}

        // Verificar status al abrir la app
        checkStatus();
    </script>
</body>
</html>
